<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; object-src 'none'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThunderClaude</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="topbar">
        <div>
          <h1>ThunderClaude</h1>
          <p id="status" class="status" aria-live="polite">Checking compose window...</p>
        </div>
        <span id="compose-mode" class="mode-badge" hidden></span>
      </header>

      <form id="rewrite-form" class="rewrite-form">
        <fieldset class="preset-group">
          <legend>Preset</legend>
          <div class="preset-grid" role="radiogroup" aria-label="Rewrite preset">
            <button class="preset-chip is-selected" type="button" data-preset="make-formal">
              Formal
            </button>
            <button class="preset-chip" type="button" data-preset="make-casual">Casual</button>
            <button class="preset-chip" type="button" data-preset="shorten">Shorten</button>
            <button class="preset-chip" type="button" data-preset="expand">Expand</button>
            <button class="preset-chip" type="button" data-preset="fix-grammar">Grammar</button>
            <button class="preset-chip" type="button" data-preset="translate">Translate</button>
            <button class="preset-chip" type="button" data-preset="reply-draft">Reply draft</button>
          </div>
        </fieldset>

        <label id="target-language-field" class="field" hidden>
          <span>Target language</span>
          <select id="target-language" name="targetLanguage">
            <option value="English">English</option>
            <option value="French">French</option>
            <option value="German">German</option>
            <option value="Spanish">Spanish</option>
            <option value="Italian">Italian</option>
            <option value="Dutch">Dutch</option>
            <option value="Portuguese">Portuguese</option>
            <option value="Japanese">Japanese</option>
            <option value="Korean">Korean</option>
            <option value="Chinese">Chinese</option>
          </select>
        </label>

        <label id="storage-phrase-field" class="field" hidden>
          <span>Storage phrase</span>
          <input
            id="storage-phrase"
            autocomplete="current-password"
            placeholder="Unlock encrypted key storage"
            type="password"
          />
        </label>

        <label class="field">
          <span>Custom instruction</span>
          <textarea
            id="custom-prompt"
            name="customPrompt"
            rows="4"
            maxlength="1000"
            placeholder="Optional, overrides the selected preset"
          ></textarea>
        </label>

        <div class="field-grid">
          <label class="field">
            <span>Provider</span>
            <select id="provider" name="providerId"></select>
          </label>
          <label class="field">
            <span>Model</span>
            <select id="model" name="modelId"></select>
          </label>
        </div>

        <label id="custom-model-field" class="field" hidden>
          <span>Custom model</span>
          <input id="custom-model" name="customModel" autocomplete="off" />
        </label>

        <label id="base-url-field" class="field" hidden>
          <span>Base URL</span>
          <input
            id="base-url"
            name="baseUrl"
            autocomplete="off"
            placeholder="https://provider.example/v1"
          />
        </label>

        <p id="error" class="error" role="alert" hidden></p>

        <button id="rewrite" class="primary-action" type="submit" disabled>Rewrite draft</button>
      </form>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
